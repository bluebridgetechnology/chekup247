services:
  # ============================================================================
  # 1. Databases & Infrastructure
  # ============================================================================
  operational-postgres:
    image: postgres:16-alpine
    container_name: chekup-operational-postgres
    restart: always
    environment:
      POSTGRES_USER: ${OPERATIONAL_DB_USER:-chekup_user}
      POSTGRES_PASSWORD: ${OPERATIONAL_DB_PASSWORD:-chekup_password}
      POSTGRES_DB: ${OPERATIONAL_DB_NAME:-chekup_operational}
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - operational_pg_data:/var/lib/postgresql/data
    networks:
      - chekup-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${OPERATIONAL_DB_USER:-chekup_user} -d ${OPERATIONAL_DB_NAME:-chekup_operational}']
      interval: 5s
      timeout: 5s
      retries: 5

  patient-postgres:
    image: postgres:16-alpine
    container_name: chekup-patient-postgres
    restart: always
    environment:
      POSTGRES_USER: ${PATIENT_DB_USER:-chekup_user}
      POSTGRES_PASSWORD: ${PATIENT_DB_PASSWORD:-chekup_password}
      POSTGRES_DB: ${PATIENT_DB_NAME:-chekup_patient}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - patient_pg_data:/var/lib/postgresql/data
    networks:
      - chekup-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PATIENT_DB_USER:-chekup_user} -d ${PATIENT_DB_NAME:-chekup_patient}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chekup-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - chekup-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_password}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: chekup-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadminpassword}
    volumes:
      - minio_data:/data
    networks:
      - chekup-network
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 0']
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Application Services
  # ============================================================================
  api:
    image: ${IMAGE_PREFIX:-ghcr.io/bluebridgetechnology}/chekup247-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: chekup-api
    restart: always
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=4000
      - OPERATIONAL_DB_HOST=operational-postgres
      - OPERATIONAL_DB_PORT=5432
      - PATIENT_DB_HOST=patient-postgres
      - PATIENT_DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_ENDPOINT=http://minio:9000
    depends_on:
      operational-postgres:
        condition: service_healthy
      patient-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - chekup-network

  patient-web:
    image: ${IMAGE_PREFIX:-ghcr.io/bluebridgetechnology}/chekup247-patient-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/patient-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.chekup247.com/api/v1
        NEXT_PUBLIC_DOCTOR_PORTAL_URL: https://doctor.chekup247.com
        NEXT_PUBLIC_SITE_URL: https://chekup247.com
        NEXT_PUBLIC_APP_URL: https://chekup247.com
    container_name: chekup-patient-web
    restart: always
    depends_on:
      - api
    networks:
      - chekup-network

  doctor-portal:
    image: ${IMAGE_PREFIX:-ghcr.io/bluebridgetechnology}/chekup247-doctor-portal:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/doctor-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.chekup247.com/api/v1
        NEXT_PUBLIC_WS_URL: https://api.chekup247.com
        NEXT_PUBLIC_PATIENT_PORTAL_URL: https://chekup247.com
    container_name: chekup-doctor-portal
    restart: always
    depends_on:
      - api
    networks:
      - chekup-network

  admin-panel:
    image: ${IMAGE_PREFIX:-ghcr.io/bluebridgetechnology}/chekup247-admin-panel:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/admin-panel/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.chekup247.com/api/v1
    container_name: chekup-admin-panel
    restart: always
    depends_on:
      - api
    networks:
      - chekup-network

  # ============================================================================
  # 3. Reverse Proxy & Automatic SSL (Let's Encrypt)
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: chekup-caddy
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - patient-web
      - doctor-portal
      - admin-panel
      - api
      - minio
    networks:
      - chekup-network

volumes:
  operational_pg_data:
  patient_pg_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  chekup-network:
    driver: bridge
