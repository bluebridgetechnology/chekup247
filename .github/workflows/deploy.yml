name: Deploy ChekUp247 to Live VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. Build & Push Docker Images to GitHub Container Registry (ghcr.io)
  # ============================================================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Owner for Docker Tagging
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      # 1. NestJS Backend API
      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/chekup247-api:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/chekup247-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Patient Web (Next.js)
      - name: Build & Push Patient Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/patient-web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.chekup247.com/api/v1
            NEXT_PUBLIC_DOCTOR_PORTAL_URL=https://doctor.chekup247.com
            NEXT_PUBLIC_SITE_URL=https://chekup247.com
            NEXT_PUBLIC_APP_URL=https://chekup247.com
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/chekup247-patient-web:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/chekup247-patient-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Doctor Portal (Next.js)
      - name: Build & Push Doctor Portal Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/doctor-portal/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.chekup247.com/api/v1
            NEXT_PUBLIC_WS_URL=https://api.chekup247.com
            NEXT_PUBLIC_PATIENT_PORTAL_URL=https://chekup247.com
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/chekup247-doctor-portal:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/chekup247-doctor-portal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Admin Isolated Panel (Next.js)
      - name: Build & Push Admin Panel Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin-panel/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.chekup247.com/api/v1
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/chekup247-admin-panel:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/chekup247-admin-panel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 2. Deploy to Live VPS via SSH
  # ============================================================================
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Downcase Repository Owner
        id: repo_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting automated deployment on VPS..."

            cd /opt/chekup247

            # Optional: Pull latest repository changes (compose files, caddy config)
            if [ -d .git ]; then
              echo "📥 Pulling latest git config..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # Authenticate to GHCR (using GHCR_PAT if provided, or GITHUB_TOKEN)
            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "📦 Pulling latest Docker images..."
            IMAGE_PREFIX=ghcr.io/${{ steps.repo_owner.outputs.owner }} IMAGE_TAG=latest \
              docker compose -f docker-compose.prod.yml pull

            echo "🔄 Rolling update containers..."
            IMAGE_PREFIX=ghcr.io/${{ steps.repo_owner.outputs.owner }} IMAGE_TAG=latest \
              docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "🔄 Reloading Caddy to pick up config changes..."
            docker restart chekup-caddy

            echo "⏳ Waiting for API to report healthy..."
            API_CONTAINER=chekup-api
            HEALTH_TIMEOUT=90
            elapsed=0
            while true; do
              state=$(docker inspect -f '{{.State.Status}}' "$API_CONTAINER" 2>/dev/null || echo "missing")
              health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$API_CONTAINER" 2>/dev/null || echo "missing")

              if [ "$health" = "healthy" ]; then
                echo "✅ API is healthy."
                break
              fi

              if [ "$state" = "restarting" ] || [ "$state" = "exited" ] || [ "$state" = "dead" ] || [ "$state" = "missing" ]; then
                echo "❌ Deployment FAILED: API container is '$state' (health: '$health'). Last 80 log lines:"
                docker logs --tail 80 "$API_CONTAINER" 2>&1 || true
                exit 1
              fi

              if [ "$elapsed" -ge "$HEALTH_TIMEOUT" ]; then
                echo "❌ Deployment FAILED: API did not become healthy within ${HEALTH_TIMEOUT}s (state: '$state', health: '$health'). Last 80 log lines:"
                docker logs --tail 80 "$API_CONTAINER" 2>&1 || true
                exit 1
              fi

              sleep 3
              elapsed=$((elapsed + 3))
            done

            echo "🧹 Cleaning up dangling images..."
            docker image prune -f

            echo "✅ Deployment successful! Active containers:"
            docker compose -f docker-compose.prod.yml ps
