name: ChekUp247 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Workspace
        run: npm run lint --if-present

      - name: Build All Workspaces
        run: npm run build

  test-api:
    name: Test Backend API
    runs-on: ubuntu-latest
    services:
      operational-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chekup_user
          POSTGRES_PASSWORD: chekup_password
          POSTGRES_DB: chekup_operational
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      patient-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chekup_user
          POSTGRES_PASSWORD: chekup_password
          POSTGRES_DB: chekup_patient
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm run test --workspace=@chekup247/api
        env:
          NODE_ENV: test
          OPERATIONAL_DB_HOST: localhost
          OPERATIONAL_DB_PORT: 5432
          OPERATIONAL_DB_USER: chekup_user
          OPERATIONAL_DB_PASSWORD: chekup_password
          OPERATIONAL_DB_NAME: chekup_operational
          PATIENT_DB_HOST: localhost
          PATIENT_DB_PORT: 5433
          PATIENT_DB_USER: chekup_user
          PATIENT_DB_PASSWORD: chekup_password
          PATIENT_DB_NAME: chekup_patient
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-minimum-32-chars-long
